name: Validar estructura de entregas

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar estructura base
        run: node scripts/validar-estructura.js

      - name: Validar destino del PR
        if: github.base_ref == 'main'
        run: |
          echo "Los PR de estudiantes no deben apuntar a main. Deben apuntar a dev."
          exit 1

      - name: Validar rutas modificadas por estudiantes
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const allowed = /^ejercicios\/ejercicio-\d{3}\/resoluciones\/[a-z0-9]+(?:-[a-z0-9]+)+\/.+/;
            const ignored = new Set(['README.md', 'CONTRIBUTING.md']);
            const invalid = files
              .map(file => file.filename)
              .filter(filename => !ignored.has(filename))
              .filter(filename => !allowed.test(filename));
            if (invalid.length > 0) {
              const message = `Estructura incorrecta. Cada entrega debe ir en ejercicios/ejercicio-000/resoluciones/nombre-apellido/. Archivos invalidos: ${invalid.join(', ')}`;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: `Revision automatica: PR rechazado por estructura incorrecta.\n\n${message}\n\nCorrige la ubicacion de tus archivos y vuelve a actualizar este PR hacia dev.`
              });
              core.setFailed(message);
            }
